<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Number Guessing Game</title>
    <link rel="stylesheet" href="style4.css">
  
</head>
<body style="background-color:#212121; color:#fff;">
  
    <div id="wrapper">
      <h1>Probabilistic Number Estimation Game</h1>
    <p>Attempt to deduce a randomly selected number within the range of 1 to 100</p>
    <p>You are permitted a maximum of 10 attempts to accurately identify the correct value</p>
    </br>
        <form class="form">
            <label2 for="guessField" id="guess">Try to deduce the secret number.</label>
            <input type="text" id="guessField" class="guessField">
            <input type="submit" id="subt" value="Submit guess" class="guessSubmit">
        </form>

        <div class="resultParas">
            <p >Previous Guesses: <span class="guesses"></span></p>
            <p >Guesses Remaining: <span class="lastResult">10</span></p>
            <p class="lowOrHi"></p>
        </div>
    </div>
    <script src="project4.js"></script>
</body>
</html>
